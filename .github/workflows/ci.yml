name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  change_scope:
    name: Classify change scope
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.classify.outputs.run_tests }}
      run_docs_contract_checks: ${{ steps.classify.outputs.run_docs_contract_checks }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python and uv
        uses: albumentations-team/ci-foundation/actions/setup-python-uv@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          python-version: "3.11"
          uv-version: "0.12.0"
          cache-dependency-glob: tools/classify_ci_changes.py
          cache-suffix: albucore-change-scope
          cache-enabled: "false"

      - name: Classify version-only changes
        id: classify
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/classify_ci_changes.py
          --repo .
          "${BASE_REVISION}"
          "${HEAD_REVISION}"
          >> "${GITHUB_OUTPUT}"

      - name: Check documentation contracts
        if: steps.classify.outputs.run_docs_contract_checks == 'true'
        run: python tools/ci_matrix.py check

  test:
    needs: change_scope
    if: needs.change_scope.outputs.run_tests == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: albumentations-team/ci-foundation/actions/setup-python-uv@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: "0.12.0"
          cache-dependency-glob: |
            requirements-dev.txt
            pyproject.toml
            uv.lock
          cache-suffix: albucore-ci-torch-cpu

      - name: Install CPU-only Torch
        uses: albumentations-team/ci-foundation/actions/torch-cpu@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          mode: install
          requirement: "torch>=2.13.0"

      - name: Install dependencies
        run: |
          uv pip install -e ".[torch]"
          uv pip install -r requirements-dev.txt

      - name: Verify uv.lock is up-to-date
        if: matrix.python-version == '3.10'
        run: uv lock --check

      - name: Check public router contracts
        if: matrix.python-version == '3.10'
        run: uv run python tools/check_router_contracts.py

      - name: Check CI matrix policy
        if: matrix.python-version == '3.10'
        run: uv run python tools/ci_matrix.py check

      - name: Check code formatting with pre-commit
        if: matrix.python-version == '3.10'
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run tests with coverage
        if: matrix.python-version == '3.10'
        run: pytest tests/ --hypothesis-profile=ci-fast --cov=albucore --cov-report=xml --cov-report=term

      - name: Run tests
        if: matrix.python-version != '3.10'
        run: pytest tests/ --hypothesis-profile=ci-fast

      - name: Collect test environment
        if: always()
        run: uv run python tools/collect_test_environment.py --output-json test-environment.json

      - name: Upload test environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-environment-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-environment.json
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        if: matrix.python-version == '3.10'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  macos-arm64-matmul:
    name: macOS arm64 matmul warning regressions
    needs: change_scope
    if: needs.change_scope.outputs.run_tests == 'true'
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: albumentations-team/ci-foundation/actions/setup-python-uv@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          python-version: "3.10"
          uv-version: "0.12.0"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: albucore-macos-arm64-torch-cpu

      - name: Install CPU-only Torch
        uses: albumentations-team/ci-foundation/actions/torch-cpu@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          mode: install
          requirement: "torch>=2.13.0"

      - name: Install regression-test dependencies
        run: uv pip install -e ".[headless,torch]" "numpy==2.2.6" -r requirements-dev.txt

      - name: Verify arm64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Run Accelerate warning regressions
        run: >-
          pytest tests/test_matmul.py
          -W error
          -q

  declared-dependency-ranges:
    needs: change_scope
    if: needs.change_scope.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: albumentations-team/ci-foundation/actions/setup-python-uv@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          python-version: "3.10"
          uv-version: "0.12.0"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: albucore-declared-ranges-torch-cpu

      - name: Install CPU-only Torch
        uses: albumentations-team/ci-foundation/actions/torch-cpu@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          mode: install
          requirement: "torch>=2.13.0"

      - name: Install declared dependency ranges
        run: |
          uv pip install -e ".[torch]" --no-deps
          uv pip install \
            "numpy>=1.24.4" \
            "numkong>=7.8.0" \
            "stringzilla>=5.1.2" \
            "opencv-python-headless>=5.0.0.93" \
            hypothesis \
            pytest \
            pytest-randomly

      - name: Check public router contracts
        run: python tools/check_router_contracts.py

      - name: Run declared-range tests
        run: pytest tests/ --hypothesis-profile=ci-fast

      - name: Collect test environment
        if: always()
        run: python tools/collect_test_environment.py --output-json test-environment.json

      - name: Upload test environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-environment-declared-ranges
          path: test-environment.json
          if-no-files-found: error
