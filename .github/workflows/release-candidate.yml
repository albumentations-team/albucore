name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate, matching pyproject.toml
        required: true

permissions:
  actions: read
  checks: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main for the release candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install uncached uv and Python
        uses: albumentations-team/ci-foundation/actions/setup-python-uv-uncached@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          python-version: "3.11"
          uv-version: "0.12.0"

      - name: Resolve and verify release metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          REQUESTED_COMMIT_SHA="$(git rev-parse HEAD)"
          python tools/validate_release_candidate.py metadata \
            --version "${REQUESTED_VERSION}" \
            --commit-sha "${REQUESTED_COMMIT_SHA}" \
            --github-env "${GITHUB_ENV}" \
            --fetch-origin-main \
            --require-origin-main

      - name: Verify CI workflow succeeded for candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --workflow CI \
            --commit "${CANDIDATE_COMMIT_SHA}" \
            --json conclusion,status,databaseId,url \
            --limit 20 \
            > /tmp/albucore-ci-runs.json
          python tools/validate_release_candidate.py ci-runs \
            --runs-json /tmp/albucore-ci-runs.json

      - name: Verify license and CLA provenance
        run: python tools/verify_legal_integrity.py

      - name: Build distributions
        run: uv build

      - name: Verify distribution license and CLA integrity
        run: python tools/verify_legal_integrity.py --artifacts dist/*.whl dist/*.tar.gz

      - name: Install release validation dependencies
        run: uv sync --frozen --extra headless --extra torch --group dev

      - name: Verify CPU-only Torch
        uses: albumentations-team/ci-foundation/actions/torch-cpu@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          mode: verify

      - name: Check public router contracts
        run: uv run python tools/check_router_contracts.py

      - name: Check CI matrix policy
        run: uv run python tools/ci_matrix.py check

      - name: Verify golden vectors
        run: uv run python tools/verify_golden_vectors.py

      - name: Run release property tests
        run: uv run pytest tests/property --hypothesis-profile=release

      - name: Check distribution metadata
        run: uv tool run --from twine twine check dist/*

      - name: Create wheel smoke environment
        id: wheel_smoke
        run: |
          VENV_DIR="${RUNNER_TEMP}/albucore-release-venv"
          python -m venv "$VENV_DIR"
          echo "python=${VENV_DIR}/bin/python" >> "${GITHUB_OUTPUT}"

      - name: Install CPU-only Torch for wheel smoke test
        uses: albumentations-team/ci-foundation/actions/torch-cpu@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          mode: install
          python: ${{ steps.wheel_smoke.outputs.python }}
          requirement: "torch>=2.13.0"

      - name: Smoke test built wheel
        env:
          WHEEL_SMOKE_PYTHON: ${{ steps.wheel_smoke.outputs.python }}
        run: |
          "$WHEEL_SMOKE_PYTHON" -m pip install --upgrade pip
          if [ -n "${HEADLESS_RUNTIME_DEPENDENCIES:-}" ]; then
            printf '%s\n' "${HEADLESS_RUNTIME_DEPENDENCIES}" > "${RUNNER_TEMP}/headless-runtime-requirements.txt"
            "$WHEEL_SMOKE_PYTHON" -m pip install -r "${RUNNER_TEMP}/headless-runtime-requirements.txt"
          fi
          "$WHEEL_SMOKE_PYTHON" -m pip install dist/*.whl
          cd /tmp
          "$WHEEL_SMOKE_PYTHON" -c 'import albucore, numpy as np; img = np.zeros((64, 64, 3), dtype=np.uint8); print("albucore smoke test passed, version:", albucore.__version__)'

      - name: Verify uv.lock is up-to-date
        run: uv lock --check

      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --extra torch --format requirements-txt --output-file dist/runtime-requirements.txt

      - name: Generate CycloneDX SBOM
        run: |
          uv tool run --from cyclonedx-bom cyclonedx-py requirements dist/runtime-requirements.txt \
            --output-format JSON \
            --output-file "dist/${SBOM_FILENAME}"

      - name: Generate release candidate metadata
        run: |
          python tools/validate_release_candidate.py candidate-metadata \
            --dist-dir dist \
            --version "${PACKAGE_VERSION}" \
            --commit-sha "${CANDIDATE_COMMIT_SHA}"

      - name: Generate checksums
        run: |
          (
            cd dist
            files=(
              ./*.whl
              ./*.tar.gz
              ./*-sbom.cdx.json
              ./runtime-requirements.txt
              ./release-candidate-metadata.json
            )
            sha256sum "${files[@]}" > SHA256SUMS.txt
          )

      - name: Generate release summary
        run: |
          uv run python tools/generate_release_summary.py \
            --version "${PACKAGE_VERSION}" \
            --dist-dir dist \
            --output-md "dist/albucore-${PACKAGE_VERSION}-release-summary.md"
          (
            cd dist
            sha256sum ./albucore-*-release-summary.md >> SHA256SUMS.txt
          )

      - name: Write release candidate step summary
        if: always()
        run: |
          {
            echo "## Release Candidate"
            echo
            echo "- Version: ${PACKAGE_VERSION:-unknown}"
            echo "- Commit: ${CANDIDATE_COMMIT_SHA:-unknown}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release candidate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*-sbom.cdx.json
            dist/SHA256SUMS.txt
            dist/runtime-requirements.txt
            dist/release-candidate-metadata.json
            dist/albucore-*-release-summary.md
          if-no-files-found: warn
