name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    paths-ignore:
      - AGENTS.md
      - CONTRIBUTING.md
      - MAINTAINERS.md
      - README.md
      - SECURITY.md
      - docs/**
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  runtime-dependency-audit:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: albumentations-team/ci-foundation/actions/setup-python-uv@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          python-version: "3.12"
          uv-version: "0.12.0"
          cache-dependency-glob: uv.lock
          cache-suffix: albucore-runtime-audit
          cache-enabled: "false"

      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --extra torch --format requirements-txt --output-file runtime-requirements.txt

      - name: Run pip-audit on runtime dependencies
        run: uv tool run --from pip-audit pip-audit --extra-index-url https://download.pytorch.org/whl/cpu -r runtime-requirements.txt

      - name: Upload runtime dependency export
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-requirements
          path: runtime-requirements.txt
          if-no-files-found: error

  dev-dependency-audit:
    name: Dev dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: albumentations-team/ci-foundation/actions/setup-python-uv@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          python-version: "3.12"
          uv-version: "0.12.0"
          cache-dependency-glob: uv.lock
          cache-suffix: albucore-dev-audit
          cache-enabled: "false"

      - name: Export locked all dependencies
        run: uv export --frozen --no-emit-project --extra torch --format requirements-txt --output-file all-requirements.txt

      - name: Run pip-audit on all dependencies
        run: uv tool run --from pip-audit pip-audit --extra-index-url https://download.pytorch.org/whl/cpu -r all-requirements.txt

      - name: Upload all dependency export
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: all-requirements
          path: all-requirements.txt
          if-no-files-found: error

  workflow-audit:
    name: GitHub Actions audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: albumentations-team/ci-foundation/actions/setup-python-uv@93efc801c2f22e08e40000dec2541fd1cafa5f59
        with:
          python-version: "3.12"
          uv-version: "0.12.0"
          cache-dependency-glob: uv.lock
          cache-suffix: albucore-workflow-audit
          cache-enabled: "false"

      - name: Run zizmor
        run: uv tool run --from zizmor zizmor .github/workflows --format sarif > zizmor.sarif

      - name: Upload zizmor SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zizmor-sarif
          path: zizmor.sarif
          if-no-files-found: error

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-sarif
          path: scorecard-results.sarif
          if-no-files-found: error
